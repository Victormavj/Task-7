<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My page</title>
    <link rel="stylesheet" href="style.css">
    <script src="jquery-3.4.1.min.js" defer></script>
    <script src="script.js" defer></script>
</head>
<body>
    <main class="gallery-page">
        <h1>My page</h1>
        <section class="gallery" aria-label="Image gallery">
            <button class="gallery-arrow previous" type="button" aria-label="Previous images">&#10094;</button>
            <div class="gallery-window">
                <div class="gallery-track">
                    <img src="img1.jpg" alt="img1">
                    <img src="img2.jpg" alt="img2">
                    <img src="img3.jpg" alt="img3">
                    <img src="img4.jpg" alt="img4">
                    <img src="img5.jpg" alt="img5">
                    <img src="img6.jpg" alt="img6">
                    <img src="img7.jpg" alt="img7">
                    <img src="img8.jpg" alt="img8">
                </div>
            </div>
            <button class="gallery-arrow next" type="button" aria-label="Next images">&#10095;</button>
        </section>
        <nav class="pager" aria-label="Gallery pages">
            <button class="pager-button" type="button" aria-label="Go to page 1">1</button>
            <button class="pager-button" type="button" aria-label="Go to page 2">2</button>
            <button class="pager-button" type="button" aria-label="Go to page 3">3</button>
            <button class="pager-button" type="button" aria-label="Go to page 4">4</button>
            <button class="pager-button" type="button" aria-label="Go to page 5">5</button>
            <button class="pager-button" type="button" aria-label="Go to page 6">6</button>
            <button class="pager-button" type="button" aria-label="Go to page 7">7</button>
            <button class="pager-button" type="button" aria-label="Go to page 8">8</button>
        </nav>
        <p id="pageStatus" aria-live="polite">Page 1 of 6</p>
        <footer>Victor M.</footer>
    </main>
</body>
</html>
